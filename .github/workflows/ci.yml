name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Public boundary and syntax
        run: PYTHONPATH=src python scripts/check.py
      - name: Target tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Absorbed release-gate selftest
        run: PYTHONPATH=src python -m shipcheck selftest
      - name: Canonical merge counter-proof
        run: PYTHONPATH=src python -m shipcheck probe functional
      - name: Legacy merge alias parity
        run: PYTHONPATH=src python -m safe_merge_gate probe functional
      - name: Ready and blocked merge fixtures
        run: |
          PYTHONPATH=src python -m shipcheck evaluate --snapshot examples/ready-snapshot.json --policy examples/policy.json --generated-at 2026-01-01T00:00:00Z
          set +e
          PYTHONPATH=src python -m shipcheck evaluate --snapshot examples/blocked-snapshot.json --generated-at 2026-01-01T00:00:00Z
          code=$?
          set -e
          test "$code" -eq 2

  source-history:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact source ancestry and trees
        shell: bash
        env:
          SOURCE_SHA: 8d5813d3ec492abefccc704ba16467f894d71863
          SOURCE_TREE: 3dcce371575565d698d10fbd549ae3e774ff379c
          PACKAGE_TREE: f6c15f54f350b5283075f3ee3df26ee7e49ed70c
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          test "$(git rev-parse "$SOURCE_SHA:src/shipcheck")" = "$PACKAGE_TREE"
      - name: Run exact source test gate
        shell: bash
        env:
          SOURCE_SHA: 8d5813d3ec492abefccc704ba16467f894d71863
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/shipcheck-release-gate-source"
          rm -rf "$source_dir"
          mkdir -p "$source_dir"
          git archive "$SOURCE_SHA" | tar -x -C "$source_dir"
          cd "$source_dir"
          python scripts/check.py --skip-build

  package:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install reviewed build toolchain
        run: python -m pip install --disable-pip-version-check "setuptools==83.0.0" "wheel==0.45.1"
      - name: Build wheel and sdist without isolation
        run: |
          python -m pip wheel . --no-deps --no-build-isolation -w dist
          python -c "from setuptools import build_meta; build_meta.build_sdist('dist')"
      - name: Smoke installed wheel in fresh environment
        run: python scripts/package_smoke.py $(find dist -maxdepth 1 -name '*.whl' -print -quit)
      - name: Upload release-candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shipcheck-0.1.0-py${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
