name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Public boundary and syntax
        run: PYTHONPATH=src python scripts/check.py
      - name: Tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Functional counter-proof
        run: PYTHONPATH=src python -m safe_merge_gate probe functional
      - name: Ready and blocked fixtures
        run: |
          PYTHONPATH=src python -m safe_merge_gate evaluate --snapshot examples/ready-snapshot.json --policy examples/policy.json --generated-at 2026-01-01T00:00:00Z
          set +e
          PYTHONPATH=src python -m safe_merge_gate evaluate --snapshot examples/blocked-snapshot.json --generated-at 2026-01-01T00:00:00Z
          code=$?
          set -e
          test "$code" -eq 2
      - name: Build wheel offline
        env:
          PIP_NO_INDEX: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip wheel . --no-deps -w dist
