name: GPT Sol2 consolidation verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  shipcheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Shipcheck source tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Shipcheck legacy counter-proof
        run: PYTHONPATH=src python -m safe_merge_gate probe functional
      - name: Shipcheck compatibility imports
        run: |
          PYTHONPATH=src python - <<'PY'
          import safe_merge_gate
          import shipcheck
          import shipcheck.engine
          import shipcheck.release_gate
          assert shipcheck.evaluate is safe_merge_gate.evaluate
          assert hasattr(shipcheck.release_gate, "DecisionEngine")
          PY
      - name: Shipcheck package build and isolated install
        run: |
          python -m pip install --upgrade build
          python -m build
          python -m venv /tmp/shipcheck-venv
          /tmp/shipcheck-venv/bin/python -m pip install dist/*.whl
          /tmp/shipcheck-venv/bin/python -c "import shipcheck, shipcheck.release_gate, safe_merge_gate"
          /tmp/shipcheck-venv/bin/shipcheck-release-gate capabilities

  agentops-pinned:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: vigilanty0x/automation-control-plane
          ref: ba2417bb2a29e57617dc92012f653bb4c79974be
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: AgentOps source tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: AgentOps compatibility imports
        run: |
          PYTHONPATH=src python - <<'PY'
          import agentops
          import agentmesh
          import automation_control_plane
          from agentops.routing_evidence import evaluate
          assert agentmesh.evaluate is evaluate
          assert hasattr(agentops, "ControlPlane")
          PY
      - name: AgentOps wheel and isolated install
        run: |
          python -m pip install --upgrade build
          python -m build
          python -m venv /tmp/agentops-venv
          /tmp/agentops-venv/bin/python -m pip install dist/*.whl
          /tmp/agentops-venv/bin/python -c "import agentops, agentmesh, automation_control_plane"
          /tmp/agentops-venv/bin/agentmesh --help
