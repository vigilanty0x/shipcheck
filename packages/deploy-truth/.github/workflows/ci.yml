name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check.py
      - run: python -m deploy_truth fixture examples/exact-release.json --output /tmp/truth.json
      - run: python -m deploy_truth verify-evidence /tmp/truth.json
      - run: python -m deploy_truth probe functional
      - run: python -m deploy_truth demo /tmp/deploy-truth-demo
      - run: python -m pip wheel . --no-deps --wheel-dir /tmp/wheel
