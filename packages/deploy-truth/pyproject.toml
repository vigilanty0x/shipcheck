[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deploy-truth"
version = "0.1.0"
description = "Offline release evidence across source, bundle, and live bytes."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Deploy Truth contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/vigilanty0x/deploy-truth"
Repository = "https://github.com/vigilanty0x/deploy-truth"
Issues = "https://github.com/vigilanty0x/deploy-truth/issues"

[project.scripts]
deploy-truth = "deploy_truth.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

