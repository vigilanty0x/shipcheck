name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check -e .
      - run: python scripts/check.py
      - run: python -m unittest discover -s tests -v
      - run: pr-review-council probe --level functional
      - run: pr-review-council demo --workspace /tmp/pr-review-council-demo
      - run: python -m pip wheel . --no-deps --wheel-dir /tmp/wheel
