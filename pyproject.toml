[build-system]
requires = ["setuptools>=83.0.0,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "shipcheck"
version = "0.1.0"
description = "Offline evidence-first merge and release readiness checks with fail-closed decisions and exact rollback."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "vigilanty0x"}]
keywords = ["release", "merge", "gate", "ci", "rollback", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vigilanty0x/shipcheck"
Repository = "https://github.com/vigilanty0x/shipcheck"
Issues = "https://github.com/vigilanty0x/shipcheck/issues"

[project.scripts]
shipcheck = "shipcheck.cli:main"
safe-merge-gate = "safe_merge_gate.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safe_merge_gate = ["py.typed"]
shipcheck = ["py.typed"]
"shipcheck.release_gate" = ["dashboard/*", "public_schemas/*.json", "compatibility.json"]
